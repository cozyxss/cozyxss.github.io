media:
  input: src/images
  output: /images

content:
  - name: posts
    label: Posts
    type: collection
    path: src/posts
    filename: "{year}-{month}-{day}-{title}.md"
    view:
      fields: [title, no, category, draft]
    fields:
      - name: draft
        label: "Draft (Claude publishes it)"
        type: boolean
        default: true
      - name: no
        label: Number
        type: number
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Summary (1-2 sentences for the home page)
        type: text
      - name: category
        label: Category
        type: select
        options:
          values: [LessonLearned, CTF, Notes]
      - name: tags
        label: Tags
        type: string
        list: true
      - name: cover
        label: Cover image (optional)
        type: image
      - name: body
        label: Post
        type: rich-text
        options:
          format: markdown
          path: src/images
